<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<meta name="google-site-verification"
content="yZ56jFclXP1thT-Q-xCCVeO-i572oXejzlkq7I3O84o">

<meta name="monetag"
content="6ca3dc7053a741b0d409e6c3a107b8a1">

<title>WorldChat</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* ================= TOP BAR ================= */

.topbar{
  height:62px;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.top-status{
  font-size:13px;
  color:#64748b;
}

/* ================= SETUP ================= */

.setup-page{
  min-height:calc(100vh - 62px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:38px 16px;
}

.setup-card{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:25px;
  padding:32px;
  box-shadow:0 8px 35px rgba(0,0,0,.08);
}

.setup-logo{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:25px;
}

.notice{
  background:#fff7ed;
  border:2px solid #fed7aa;
  color:#8a3b18;
  padding:18px;
  border-radius:15px;
  line-height:1.65;
  margin-bottom:25px;
}

.notice b{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  font-size:17px;
  font-weight:700;
  margin-bottom:8px;
}

.field input,
.field select{
  width:100%;
  height:56px;
  padding:0 15px;
  border:2px solid #d1d5db;
  border-radius:13px;
  background:#fff;
  color:#111827;
  outline:none;
  appearance:auto;
  -webkit-appearance:auto;
}

.field input{
  font-size:17px;
}

.field select{
  font-size:17px;
}

.field input:focus,
.field select:focus{
  border-color:#2563eb;
}

.primary-btn{
  width:100%;
  height:58px;
  border:0;
  border-radius:13px;
  background:#2563eb;
  color:#fff;
  font-size:18px;
  font-weight:800;
  margin-top:5px;
}

.primary-btn:active{
  transform:scale(.99);
}

.primary-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}

.error-box{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
  border-radius:12px;
  padding:12px;
  margin-bottom:15px;
  font-size:14px;
  line-height:1.5;
}

/* ================= APP ================= */

.app{
  display:none;
  min-height:calc(100vh - 62px);
}

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:calc(100vh - 62px);
}

/* ================= SIDEBAR ================= */

.sidebar{
  background:#fff;
  border-right:1px solid #e5e7eb;
  padding:15px;
}

.my-profile{
  background:#f8fafc;
  padding:15px;
  border-radius:13px;
  margin-bottom:15px;
}

.my-name{
  font-weight:800;
  font-size:16px;
}

.my-country{
  color:#64748b;
  font-size:13px;
  margin-top:4px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:13px;
  border-radius:11px;
  margin-bottom:5px;
  font-weight:700;
  color:#334155;
}

.nav-btn:hover{
  background:#f1f5f9;
}

.nav-btn.active{
  background:#e8f0ff;
  color:#2563eb;
}

/* ================= MAIN ================= */

.main{
  min-width:0;
  background:#f8fafc;
}

.page{
  display:none;
  min-height:calc(100vh - 62px);
  overflow:auto;
}

.page.active{
  display:block;
}

/* ================= USERS ================= */

.users-header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px;
  position:sticky;
  top:0;
  z-index:20;
}

.users-header h2{
  margin:0 0 14px;
}

.search{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
}

.user-section-title{
  padding:17px 18px 9px;
  font-size:14px;
  font-weight:800;
  color:#64748b;
}

.user-list{
  padding:0 14px 20px;
}

.user-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:9px;
}

.user-card.clickable{
  cursor:pointer;
}

.user-card.clickable:hover{
  background:#f8fafc;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#dbeafe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#2563eb;
  font-size:18px;
}

.user-info{
  flex:1;
  min-width:0;
}

.user-name{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-meta{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:700;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#94a3b8;
}

.dot.online{
  background:#22c55e;
}

.empty{
  text-align:center;
  padding:35px 20px;
  color:#94a3b8;
}

/* ================= CHAT LIST ================= */

.chats-header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px;
}

.chats-header h2{
  margin:0;
}

.chat-list{
  padding:14px;
}

/* ================= PRIVATE CHAT ================= */

.chat-page{
  background:#eef2f7;
}

.chat-header{
  height:65px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  position:sticky;
  top:0;
  z-index:30;
}

.back-btn,
.menu-btn{
  border:0;
  background:#f1f5f9;
  width:40px;
  height:40px;
  border-radius:10px;
  font-size:20px;
}

.chat-user{
  flex:1;
  min-width:0;
}

.chat-user-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-status{
  font-size:11px;
  color:#64748b;
  margin-top:2px;
}

.chat-actions{
  display:flex;
  gap:4px;
}

.ad-icon{
  width:34px;
  height:34px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:8px;
  position:relative;
  font-size:15px;
  padding:0;
}

.ad-badge{
  position:absolute;
  right:-3px;
  top:-5px;
  background:#2563eb;
  color:#fff;
  font-size:7px;
  font-weight:800;
  padding:2px 4px;
  border-radius:4px;
}

.messages{
  height:calc(100vh - 127px);
  overflow-y:auto;
  padding:18px 15px 25px;
}

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:15px;
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  word-break:break-word;
}

.message-row.mine .message{
  background:#dbeafe;
}

.message-text{
  font-size:14px;
  line-height:1.45;
}

.message-time{
  font-size:9px;
  color:#94a3b8;
  margin-top:4px;
  text-align:right;
}

.chat-input-area{
  height:62px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  gap:7px;
  padding:8px;
  position:fixed;
  bottom:0;
  left:250px;
  right:0;
  z-index:40;
}

.chat-input{
  flex:1;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:10px 12px;
  outline:none;
}

.send-btn{
  width:70px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:white;
  font-weight:700;
}

/* ================= MENU ================= */

.chat-header-wrap{
  position:relative;
}

.dropdown{
  position:absolute;
  right:10px;
  top:60px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
  display:none;
  z-index:100;
  min-width:170px;
}

.dropdown button{
  width:100%;
  padding:12px 14px;
  border:0;
  background:#fff;
  text-align:left;
}

.dropdown button:hover{
  background:#f8fafc;
}

/* ================= MODAL ================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:20px;
}

.modal{
  background:#fff;
  width:100%;
  max-width:400px;
  border-radius:15px;
  padding:20px;
}

.modal-close{
  float:right;
  border:0;
  background:#f1f5f9;
  width:32px;
  height:32px;
  border-radius:8px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topbar{
    height:58px;
  }

  .logo{
    font-size:20px;
  }

  .layout{
    display:block;
  }

  .sidebar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    z-index:150;
    border-top:1px solid #e5e7eb;
    border-right:0;
    display:flex;
    padding:5px;
    gap:3px;
    background:#fff;
  }

  .my-profile{
    display:none;
  }

  .nav-btn{
    flex:1;
    text-align:center;
    margin:0;
    padding:8px 3px;
    font-size:11px;
  }

  .page{
    min-height:calc(100vh - 126px);
    padding-bottom:70px;
  }

  .setup-page{
    padding:20px 12px 40px;
  }

  .setup-card{
    padding:24px 18px;
    border-radius:20px;
  }

  .setup-logo{
    font-size:34px;
  }

  .chat-input-area{
    left:0;
    bottom:68px;
  }

  .messages{
    height:calc(100vh - 195px);
  }

  .chat-actions{
    display:none;
  }

}

</style>

</head>

<body>

<!-- ================= TOP ================= -->

<div class="topbar">

  <div class="logo">
    🌍 WorldChat
  </div>

  <div
    class="top-status"
    id="topStatus">
    Connecting...
  </div>

</div>


<!-- ================= SETUP ================= -->

<section
  class="setup-page"
  id="setupPage">

  <div class="setup-card">

    <div class="setup-logo">
      🌍 WorldChat
    </div>

    <div
      class="error-box"
      id="setupError">
    </div>

    <div class="notice">

      <b>18+ only.</b>

      This chat is intended only for adults aged
      18 or above. Do not share passwords,
      private addresses, financial information
      or other sensitive personal information.

    </div>


    <!-- USERNAME -->

    <div class="field">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="Enter username">

    </div>


    <!-- COUNTRY -->

    <div class="field">

      <label>
        Country
      </label>

      <select id="country">

        <option value="">
          Select country
        </option>

        <option value="Sri Lanka">
          🇱🇰 Sri Lanka
        </option>

        <option value="United States">
          🇺🇸 United States
        </option>

        <option value="United Kingdom">
          🇬🇧 United Kingdom
        </option>

        <option value="Canada">
          🇨🇦 Canada
        </option>

        <option value="Australia">
          🇦🇺 Australia
        </option>

        <option value="India">
          🇮🇳 India
        </option>

        <option value="Germany">
          🇩🇪 Germany
        </option>

        <option value="France">
          🇫🇷 France
        </option>

        <option value="Italy">
          🇮🇹 Italy
        </option>

        <option value="Spain">
          🇪🇸 Spain
        </option>

        <option value="Japan">
          🇯🇵 Japan
        </option>

        <option value="South Korea">
          🇰🇷 South Korea
        </option>

        <option value="Singapore">
          🇸🇬 Singapore
        </option>

        <option value="Malaysia">
          🇲🇾 Malaysia
        </option>

        <option value="Other">
          🌎 Other
        </option>

      </select>

    </div>


    <!-- LANGUAGE -->

    <div class="field">

      <label>
        Language
      </label>

      <select id="language">

        <option value="">
          Select language
        </option>

        <option value="English">
          English
        </option>

        <option value="Sinhala">
          Sinhala
        </option>

        <option value="Tamil">
          Tamil
        </option>

        <option value="Hindi">
          Hindi
        </option>

        <option value="Spanish">
          Spanish
        </option>

        <option value="French">
          French
        </option>

        <option value="German">
          German
        </option>

        <option value="Italian">
          Italian
        </option>

        <option value="Japanese">
          Japanese
        </option>

        <option value="Korean">
          Korean
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <!-- GENDER -->

    <div class="field">

      <label>
        Gender
      </label>

      <select id="gender">

        <option value="">
          Select gender
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

        <option value="Other">
          Other
        </option>

        <option value="Prefer not to say">
          Prefer not to say
        </option>

      </select>

    </div>


    <!-- AGE -->

    <div class="field">

      <label>
        Age
      </label>

      <select id="age">

        <option value="">
          Select age
        </option>

      </select>

    </div>


    <button
      type="button"
      class="primary-btn"
      id="enterButton"
      onclick="createProfile()">

      Enter WorldChat

    </button>

  </div>

</section>


<!-- ================= APP ================= -->

<section
  class="app"
  id="app">

  <div class="layout">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

      <div class="my-profile">

        <div
          class="my-name"
          id="myName">
          User
        </div>

        <div
          class="my-country"
          id="myCountry">
        </div>

      </div>


      <button
        type="button"
        class="nav-btn active"
        id="usersNav"
        onclick="showPage('usersPage','usersNav')">

        👥
        <br>
        Users

      </button>


      <button
        type="button"
        class="nav-btn"
        id="friendsNav"
        onclick="showPage('friendsPage','friendsNav')">

        💬
        <br>
        Chats
        <span id="friendCount"></span>

      </button>


      <button
        type="button"
        class="nav-btn"
        id="chatNav"
        style="display:none"
        onclick="showPage('chatPage','chatNav')">

        💬
        <br>
        Chat

      </button>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


      <!-- ================= USERS ================= -->

      <section
        class="page active"
        id="usersPage">

        <div class="users-header">

          <h2>
            👥 All Users
          </h2>

          <input
            class="search"
            id="userSearch"
            placeholder="🔎 Search users..."
            oninput="renderUsers()">

        </div>


        <div class="user-section-title">
          🟢 ONLINE
        </div>

        <div
          class="user-list"
          id="onlineUsers">
        </div>


        <div class="user-section-title">
          ⚪ OFFLINE
        </div>

        <div
          class="user-list"
          id="offlineUsers">
        </div>

      </section>


      <!-- ================= CHATS ================= -->

      <section
        class="page"
        id="friendsPage">

        <div class="chats-header">

          <h2>
            💬 Chats
          </h2>

          <div
            style="font-size:12px;color:#64748b;margin-top:5px;">

            Your conversations

          </div>

        </div>

        <div
          class="chat-list"
          id="friendsList">
        </div>

      </section>


      <!-- ================= PRIVATE CHAT ================= -->

      <section
        class="page chat-page"
        id="chatPage">

        <div class="chat-header-wrap">


          <div class="chat-header">

            <button
              type="button"
              class="back-btn"
              onclick="closePrivateChat()">

              ←

            </button>


            <div class="chat-user">

              <div
                class="chat-user-name"
                id="chatUserName">
                User
              </div>

              <div
                class="chat-user-status"
                id="chatUserStatus">
                Offline
              </div>

            </div>


            <!-- MONETAG OPTIONS -->

            <div class="chat-actions">

              <button
                type="button"
                class="ad-icon"
                onclick="openAd()">

                📹

                <span class="ad-badge">
                  Ad
                </span>

              </button>


              <button
                type="button"
                class="ad-icon"
                onclick="openAd()">

                📞

                <span class="ad-badge">
                  Ad
                </span>

              </button>


              <button
                type="button"
                class="ad-icon"
                onclick="openAd()">

                📷

                <span class="ad-badge">
                  Ad
                </span>

              </button>


              <button
                type="button"
                class="ad-icon"
                onclick="openAd()">

                🖼️

                <span class="ad-badge">
                  Ad
                </span>

              </button>

            </div>


            <button
              type="button"
              class="menu-btn"
              onclick="toggleChatMenu()">

              ⋮

            </button>

          </div>


          <div
            class="dropdown"
            id="chatMenu">

            <button
              type="button"
              onclick="viewProfile()">

              👤 View Profile

            </button>

            <button
              type="button"
              onclick="blockUser()">

              🚫 Block

            </button>

            <button
              type="button"
              onclick="reportUser()">

              ⚠️ Report

            </button>

          </div>

        </div>


        <div
          class="messages"
          id="messages">
        </div>


        <div class="chat-input-area">

          <input
            id="messageInput"
            class="chat-input"
            maxlength="1000"
            autocomplete="off"
            placeholder="Write a message..."
            onkeydown="handleMessageKey(event)">

          <button
            type="button"
            class="send-btn"
            onclick="sendMessage()">

            Send

          </button>

        </div>

      </section>

    </main>

  </div>

</section>


<!-- ================= PROFILE MODAL ================= -->

<div
  class="modal-bg"
  id="profileModal">

  <div class="modal">

    <button
      type="button"
      class="modal-close"
      onclick="closeModal()">

      ✕

    </button>

    <h3 id="profileTitle">
      Profile
    </h3>

    <p id="profileContent"></p>

  </div>

</div>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCxMbGWolalaS_RQgjqyls44Lkn9lsYE",

  authDomain:
    "worldchat-4fc51.firebaseapp.com",

  projectId:
    "worldchat-4fc51",

  storageBucket:
    "worldchat-4fc51.firebasestorage.app",

  messagingSenderId:
    "569064178427",

  appId:
    "1:569064178427:web:7c65020d3dec55597a265e"

};


/* START FIREBASE */

firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =========================================================
   VARIABLES
========================================================= */

let firebaseUid = null;

let currentUser = null;

let allUsers = [];

let friends = [];

let friendsMap = {};

let currentChatUser = null;

let currentChatId = null;

let unsubscribeUsers = null;

let unsubscribeFriends = null;

let unsubscribeMessages = null;

let heartbeatTimer = null;


/* =========================================================
   AGE OPTIONS
========================================================= */

const ageSelect =
  document.getElementById("age");

for(let i=18;i<=100;i++){

  const option =
    document.createElement("option");

  option.value = String(i);

  option.textContent = String(i);

  ageSelect.appendChild(option);

}


/* =========================================================
   ERROR DISPLAY
========================================================= */

function showSetupError(message){

  const box =
    document.getElementById("setupError");

  box.textContent = message;

  box.style.display = "block";

}


/* =========================================================
   FIREBASE AUTH
========================================================= */

auth.onAuthStateChanged(async function(user){

  try{

    if(!user){

      document.getElementById("topStatus")
        .textContent = "Connecting...";

      await auth.signInAnonymously();

      return;

    }


    firebaseUid =
      user.uid;


    document.getElementById("topStatus")
      .textContent = "Connected";


    const doc =
      await db
      .collection("users")
      .doc(firebaseUid)
      .get();


    if(doc.exists){

      currentUser = {

        uid:firebaseUid,

        ...doc.data()

      };

      showApp();

    }else{

      document.getElementById("setupPage")
        .style.display = "flex";

    }

  }catch(error){

    console.error(error);

    document.getElementById("topStatus")
      .textContent = "Connection error";

    showSetupError(
      "Could not connect to WorldChat. " +
      "Please make sure Firebase Anonymous Authentication is enabled."
    );

  }

});

async function createProfile(){

      .getElementById("country")
      .value;

    document
      .getElementById("gender")
      .value;

    document
      .getElementById("age")
      .value;


  document.getElementById("setupError")
    .style.display = "none";


  /* USERNAME */

  if(!username){

    showSetupError(
      "Please enter your username."
    );

    return;

  }


  /* COUNTRY */

  if(!country){

    showSetupError(
      "Please select your country."
    );

    return;

  }


  /* LANGUAGE */

  if(!language){

    showSetupError(
      "Please select your language."
    );

    return;

  }


  /* GENDER */

  if(!gender){

    showSetupError(
      "Please select your gender."
    );

    return;

  }


  /* AGE */

  if(!age){

    showSetupError(
      "Please select your age."
    );

    return;

  }


  const numericAge =
    Number(age);


  if(numericAge < 18){

    showSetupError(
      "This website is for users aged 18 or above."
    );

    return;

  }


  if(!firebaseUid){

    showSetupError(
      "Connecting to server. Please wait a moment and try again."
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "Entering WorldChat...";


  try{

    const data = {

      uid: firebaseUid,

      username: username,

      country: country,

      language: language,

      gender: gender,

      age: numericAge,

      online: true,

      lastSeen:
        firebase.firestore.FieldValue.serverTimestamp(),

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    };


    await db
      .collection("users")
      .doc(firebaseUid)
      .set(
        data,
        {merge:true}
      );


    currentUser = {

      uid:firebaseUid,

      username:username,

      country:country,

      language:language,

      gender:gender,

      age:numericAge,

      online:true

    };


    showApp();


  }catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    showSetupError(
      "Could not create your profile. " +
      "Please check Firebase Firestore permissions and try again."
    );


    button.disabled = false;

    button.textContent =
      "Enter WorldChat";

  }

}

      20000
    );

);

/* =========================================================
   REAL ONLINE CHECK
========================================================= */

function isActuallyOnline(user){

  if(!user){

    return false;

  }


  if(user.uid === firebaseUid){

    return true;

  }


  if(user.online !== true){

    return false;

  }


  if(!user.lastSeen){

    return false;

  }


  if(
    typeof user.lastSeen.toMillis !==
    "function"
  ){

    return false;

  }


  const last =
    user.lastSeen.toMillis();


  return (
    Date.now() - last
  ) < 60000;

}


/* =========================================================
   USERS LISTENER
========================================================= */

function listenUsers(){

  if(unsubscribeUsers){

    unsubscribeUsers();

  }


  unsubscribeUsers =
    db
      .collection("users")
      .onSnapshot(
        function(snapshot){

          allUsers = [];


          snapshot.forEach(
            function(doc){

              if(doc.id !== firebaseUid){

                allUsers.push({

                  uid:doc.id,

                  ...doc.data()

                });

              }

            }
          );


          renderUsers();

          renderFriends();

          updateChatUserStatus();

        },
        function(error){

          console.log(
            "Users listener:",
            error
          );

        }
      );

}


/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(){

  const search =
    document
      .getElementById("userSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allUsers.filter(
      function(user){

        const name =
          (
            user.username || ""
          ).toLowerCase();


        const country =
          (
            user.country || ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          country.includes(search)
        );

      }
    );


  const online =
    filtered.filter(
      function(user){

        return isActuallyOnline(user);

      }
    );


  const offline =
    filtered.filter(
      function(user){

        return !isActuallyOnline(user);

      }
    );


  const onlineBox =
    document.getElementById(
      "onlineUsers"
    );


  const offlineBox =
    document.getElementById(
      "offlineUsers"
    );


  onlineBox.innerHTML = "";

  offlineBox.innerHTML = "";


  if(!online.length){

    onlineBox.innerHTML =
      '<div class="empty">No online users right now.</div>';

  }else{

    online.forEach(
      function(user){

        onlineBox.appendChild(
          createUserCard(
            user,
            true
          )
        );

      }
    );

  }


  if(!offline.length){

    offlineBox.innerHTML =
      '<div class="empty">No offline users.</div>';

  }else{

    offline.forEach(
      function(user){

        offlineBox.appendChild(
          createUserCard(
            user,
            false
          )
        );

      }
    );

  }

}

/* =========================================================
   FRIENDS / CHATS LISTENER
========================================================= */

function listenFriends(){

  if(unsubscribeFriends){

    unsubscribeFriends();

  }


  unsubscribeFriends =
    db
      .collection("privateChats")
      .where(
        "participants",
        "array-contains",
        firebaseUid
      )
      .onSnapshot(
        function(snapshot){

          friends = [];

          friendsMap = {};


          snapshot.forEach(
            function(doc){

              const data =
                doc.data();


              const participants =
                data.participants ||
                [];


              const otherUid =
                participants.find(
                  function(id){

                    return id !==
                      firebaseUid;

                  }
                );


              if(!otherUid) return;


              const otherUser =
                allUsers.find(
                  function(user){

                    return user.uid ===
                      otherUid;

                  }
                );


              if(otherUser){

                const item = {

                  ...otherUser,

                  chatId:doc.id,

                  lastMessage:
                    data.lastMessage ||
                    "",

                  updatedAt:
                    data.updatedAt ||
                    null

                };


                friends.push(item);

                friendsMap[
                  otherUid
                ] = item;

              }

            }
          );


          friends.sort(
            function(a,b){

              const aTime =
                a.updatedAt &&
                a.updatedAt.toMillis
                  ? a.updatedAt.toMillis()
                  : 0;


              const bTime =
                b.updatedAt &&
                b.updatedAt.toMillis
                  ? b.updatedAt.toMillis()
                  : 0;


              return bTime - aTime;

            }
          );


          renderFriends();

        },
        function(error){

          console.log(
            "Friends listener:",
            error
          );

        }
      );

}

/* =========================================================
   OPEN PRIVATE CHAT
========================================================= */

async function openPrivateChat(user){

  if(
    !user ||
    !user.uid
  ){

    return;

  }


  currentChatUser =
    user;


  if(friendsMap[user.uid]){

    currentChatId =
      friendsMap[user.uid]
        .chatId;

  }else{

    const ids = [

      firebaseUid,

      user.uid

    ].sort();


    currentChatId =
      ids[0] +
      "_" +
      ids[1];


    await db
      .collection("privateChats")
      .doc(currentChatId)
      .set({

        participants:[
          firebaseUid,
          user.uid
        ],

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        lastMessage:""

      },{
        merge:true
      });

  }


  document
    .getElementById(
      "chatUserName"
    )
    .textContent =
      user.username ||
      "User";


  updateChatUserStatus();


  document
    .getElementById(
      "chatMenu"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "chatNav"
    )
    .style.display =
      "block";


  showPage(
    "chatPage",
    "chatNav"
  );


  listenMessages();


  setTimeout(
    function(){

      document
        .getElementById(
          "messageInput"
        )
        .focus();

    },
    100
  );

}


/* =========================================================
   MESSAGE LISTENER
========================================================= */

function listenMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML =
    '<div class="empty">Loading messages...</div>';


  unsubscribeMessages =
    db
      .collection("privateChats")
      .doc(currentChatId)
      .collection("messages")
      .orderBy(
        "createdAt",
        "asc"
      )
      .onSnapshot(
        function(snapshot){

          box.innerHTML = "";


          if(snapshot.empty){

            box.innerHTML =
              '<div class="empty">No messages yet.<br>Send the first message.</div>';

            return;

          }


          snapshot.forEach(
            function(doc){

              renderMessage(
                doc.data()
              );

            }
          );


          scrollMessages();

        },
        function(error){

          console.log(
            "Message error:",
            error
          );


          box.innerHTML =
            '<div class="empty">Unable to load messages.</div>';

        }
      );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

  const box =
    document.getElementById(
      "messages"
    );


  const row =
    document.createElement("div");


  row.className =
    "message-row" +
    (
      data.uid === firebaseUid
        ? " mine"
        : ""
    );


  const bubble =
    document.createElement("div");


  bubble.className =
    "message";


  const text =
    document.createElement("div");


  text.className =
    "message-text";


  text.textContent =
    data.text ||
    "";


  const time =
    document.createElement("div");


  time.className =
    "message-time";


  if(
    data.createdAt &&
    typeof data.createdAt.toDate ===
    "function"
  ){

    time.textContent =
      data.createdAt
        .toDate()
        .toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

  }


  bubble.appendChild(text);

  bubble.appendChild(time);

  row.appendChild(bubble);

  box.appendChild(row);

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(
    !currentChatId ||
    !currentChatUser
  ){

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  input.value = "";


  try{

    const chatRef =
      db
        .collection("privateChats")
        .doc(currentChatId);


    await chatRef
      .collection("messages")
      .add({

        uid:firebaseUid,

        text:text,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    await chatRef.set({

      participants:[
        firebaseUid,
        currentChatUser.uid
      ],

      lastMessage:text,

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    },{
      merge:true
    });


  }catch(error){

    console.error(error);

    alert(
      "Message could not be sent."
    );

  }

}

/* =========================================================
   CHAT STATUS
========================================================= */

function updateChatUserStatus(){

  if(!currentChatUser){

    return;

  }


  const latest =
    allUsers.find(
      function(user){

        return user.uid ===
          currentChatUser.uid;

      }
    ) ||
    currentChatUser;


  currentChatUser =
    latest;


  const online =
    isActuallyOnline(latest);


  document
    .getElementById(
      "chatUserStatus"
    )
    .textContent =
      online
        ? "🟢 Online"
        : "⚪ Offline";

}

   BLOCK
========================================================= */

async function blockUser(){

  if(!currentChatUser){

    return;

  }


  const ok =
    confirm(
      "Block " +
      currentChatUser.username +
      "?"
    );


  if(!ok) return;


  try{

    await db
      .collection("users")
      .doc(firebaseUid)
      .set({

        blockedUsers:
          firebase.firestore
            .FieldValue
            .arrayUnion(
              currentChatUser.uid
            )

      },{
        merge:true
      });


    alert(
      "User blocked."
    );


    closePrivateChat();


  }catch(error){

    console.log(error);

    alert(
      "Could not block this user."
    );

  }


  document
    .getElementById(
      "chatMenu"
    )
    .style.display =
      "none";

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

  "click",
  function(event){

    const menu =
      document.getElementById(
        "chatMenu"
      );


    const button =
      document.querySelector(
        ".menu-btn"
      );


    if(
      menu &&
      !menu.contains(event.target) &&
      button &&
      !button.contains(event.target)
    ){

      menu.style.display =
        "none";

    }

  }
);
