<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WorldChat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f5f9;
  color:#222;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  position:relative;
  padding-bottom:65px;
}

header{
  background:#1877f2;
  color:#fff;
  padding:16px;
  font-size:21px;
  font-weight:bold;
}

.status{
  padding:10px 15px;
  font-size:13px;
  color:#666;
  background:#fafafa;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.user{
  display:flex;
  align-items:center;
  padding:13px 15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-right:12px;
}

.userInfo{
  flex:1;
}

.userName{
  font-weight:bold;
}

.online{
  color:#16a34a;
  font-size:12px;
  margin-top:3px;
}

.offline{
  color:#999;
  font-size:12px;
  margin-top:3px;
}

.badge{
  background:#e53935;
  color:#fff;
  min-width:22px;
  height:22px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  padding:0 6px;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:62px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  z-index:20;
}

.navBtn{
  flex:1;
  border:0;
  background:#fff;
  font-size:14px;
  cursor:pointer;
}

.navBtn.active{
  color:#1877f2;
  font-weight:bold;
}

.setup{
  padding:25px 18px;
}

.setup input,
.setup select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#1877f2;
  color:white;
  font-size:16px;
  margin-top:10px;
}

.chatHeader{
  display:flex;
  align-items:center;
  padding:12px;
  background:#1877f2;
  color:#fff;
}

.back{
  border:0;
  background:none;
  color:white;
  font-size:22px;
  margin-right:10px;
}

.chatUser{
  font-weight:bold;
}

.messages{
  padding:15px;
  height:calc(100vh - 180px);
  overflow-y:auto;
  background:#f5f6f8;
}

.message{
  max-width:78%;
  padding:9px 12px;
  margin:7px 0;
  border-radius:15px;
  word-wrap:break-word;
}

.mine{
  background:#1877f2;
  color:white;
  margin-left:auto;
}

.theirs{
  background:#fff;
  border:1px solid #ddd;
}

.chatTools{
  display:flex;
  gap:8px;
  padding:8px;
  background:white;
  border-top:1px solid #ddd;
}

.adIcon{
  flex:1;
  position:relative;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:10px;
  font-size:20px;
  cursor:pointer;
}

.adLabel{
  position:absolute;
  top:2px;
  right:3px;
  font-size:8px;
  background:#ff9800;
  color:white;
  padding:2px 4px;
  border-radius:3px;
}

.sendBox{
  display:flex;
  padding:8px;
  background:#fff;
  border-top:1px solid #ddd;
}

.sendBox input{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:20px;
}

.sendBox button{
  margin-left:7px;
  width:55px;
  border:0;
  border-radius:20px;
  background:#1877f2;
  color:#fff;
}

.empty{
  text-align:center;
  color:#888;
  padding:40px 20px;
}
</style>
</head>

<body>

<div class="app">

<header>WorldChat</header>

<div id="status" class="status">
Connecting...
</div>

<!-- SETUP -->
<div id="setupScreen" class="screen">
  <div class="setup">

    <h2>Create Profile</h2>

    <input id="nameInput" placeholder="Username">

    <input id="countryInput" placeholder="Country">

    <input id="languageInput" placeholder="Language">

    <select id="genderInput">
      <option value="">Select gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <button class="primary" onclick="saveProfile()">
      Continue
    </button>

  </div>
</div>

<!-- USERS -->
<div id="usersScreen" class="screen">
  <div id="usersList"></div>
</div>

<!-- FRIENDS -->
<div id="friendsScreen" class="screen">
  <div id="friendsList"></div>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">

  <div class="chatHeader">

    <button class="back" onclick="closeChat()">
      ←
    </button>

    <div class="chatUser" id="chatUserName">
      Chat
    </div>

  </div>

  <div id="messages" class="messages"></div>

  <!-- Advertisement buttons -->
  <div class="chatTools">

    <button class="adIcon" onclick="openAd()">
      📹
      <span class="adLabel">Ad</span>
    </button>

    <button class="adIcon" onclick="openAd()">
      📞
      <span class="adLabel">Ad</span>
    </button>

    <button class="adIcon" onclick="openAd()">
      📷
      <span class="adLabel">Ad</span>
    </button>

    <button class="adIcon" onclick="openAd()">
      🖼️
      <span class="adLabel">Ad</span>
    </button>

  </div>

  <div class="sendBox">

    <input
      id="messageInput"
      placeholder="Write a message..."
      onkeydown="handleEnter(event)"
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<!-- NAVIGATION -->
<div id="bottomNav" class="bottomNav">

  <button
    id="usersBtn"
    class="navBtn active"
    onclick="showUsers()">
    👥<br>
    Users
  </button>

  <button
    id="friendsBtn"
    class="navBtn"
    onclick="showFriends()">
    💬<br>
    Friends
  </button>

</div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCxMbGWolalaS_RQgjqyls44Lkn9lsWFYE",
  authDomain: "worldchat-4fc51.firebaseapp.com",
  projectId: "worldchat-4fc51",
  storageBucket: "worldchat-4fc51.firebasestorage.app",
  messagingSenderId: "569064178427",
  appId: "1:569064178427:web:7c65020d3dec55597a265e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let myProfile = null;
let selectedUser = null;
let unsubscribeMessages = null;
let unsubscribeUsers = null;

const statusBox =
  document.getElementById("status");


/* =========================
   AD LINK
========================= */

const AD_LINK = "YOUR_AD_LINK_HERE";

function openAd(){

  if(
    !AD_LINK ||
    AD_LINK === "YOUR_AD_LINK_HERE"
  ){
    alert("Ad link has not been configured.");
    return;
  }

  window.open(
    AD_LINK,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================
   AUTH
========================= */

auth.signInAnonymously()

.then(result => {

  currentUser = result.user;

  statusBox.innerHTML =
    "Connected";

  loadProfile();

})

.catch(error => {

  console.error(error);

  statusBox.innerHTML =
    "Firebase connection failed.";

});


/* =========================
   PROFILE
========================= */

function loadProfile(){

  db.collection("users")
    .doc(currentUser.uid)
    .get()

    .then(doc => {

      if(doc.exists){

        myProfile = doc.data();

        markOnline();

        showUsers();

        startUsersListener();

      }else{

        showSetup();

      }

    });

}


function showSetup(){

  document
    .getElementById("setupScreen")
    .classList.add("active");

  document
    .getElementById("bottomNav")
    .style.display = "none";
}


function saveProfile(){

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();

  if(!name){

    alert("Please enter a username.");

    return;
  }

  myProfile = {

    uid:currentUser.uid,

    name:name,

    country:
      document
        .getElementById("countryInput")
        .value
        .trim(),

    language:
      document
        .getElementById("languageInput")
        .value
        .trim(),

    gender:
      document
        .getElementById("genderInput")
        .value,

    online:true,

    lastSeen:
      firebase.firestore.FieldValue.serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };

  db.collection("users")
    .doc(currentUser.uid)
    .set(myProfile)

    .then(() => {

      document
        .getElementById("setupScreen")
        .classList.remove("active");

      document
        .getElementById("bottomNav")
        .style.display = "flex";

      showUsers();

      startUsersListener();

    });

}


/* =========================
   ONLINE STATUS
========================= */

function markOnline(){

  db.collection("users")
    .doc(currentUser.uid)
    .update({

      online:true,

      lastSeen:
        firebase.firestore.FieldValue.serverTimestamp()

    })
    .catch(()=>{});

}


setInterval(
  markOnline,
  20000
);


/* =========================
   USERS
========================= */

function startUsersListener(){

  if(unsubscribeUsers)
    unsubscribeUsers();

  unsubscribeUsers =
    db.collection("users")

      .onSnapshot(snapshot => {

        const list =
          document.getElementById("usersList");

        list.innerHTML = "";

        let count = 0;

        snapshot.forEach(doc => {

          const user = doc.data();

          if(
            user.uid !== currentUser.uid &&
            user.online === true
          ){

            count++;

            const div =
              document.createElement("div");

            div.className = "user";

            div.onclick = () =>
              openChat(user);

            const initial =
              (user.name || "?")
              .charAt(0)
              .toUpperCase();

            div.innerHTML = `

              <div class="avatar">
                ${escapeHtml(initial)}
              </div>

              <div class="userInfo">

                <div class="userName">
                  ${escapeHtml(user.name || "User")}
                </div>

                <div class="online">
                  ● Online
                </div>

              </div>

            `;

            list.appendChild(div);

          }

        });

        if(count === 0){

          list.innerHTML =
            `<div class="empty">
              No users online
            </div>`;

        }

      });

}


/* =========================
   FRIENDS
========================= */

function showFriends(){

  hideScreens();

  document
    .getElementById("friendsScreen")
    .classList.add("active");

  document
    .getElementById("usersBtn")
    .classList.remove("active");

  document
    .getElementById("friendsBtn")
    .classList.add("active");

  loadFriends();

}


async function loadFriends(){

  const list =
    document.getElementById("friendsList");

  list.innerHTML =
    `<div class="empty">
      Loading...
    </div>`;

  const snapshot =
    await db.collection("privateChats")
      .where(
        "participants",
        "array-contains",
        currentUser.uid
      )
      .get();

  list.innerHTML = "";

  if(snapshot.empty){

    list.innerHTML =
      `<div class="empty">
        No friends yet.
      </div>`;

    return;
  }

  for(const doc of snapshot.docs){

    const data = doc.data();

    const otherUid =
      data.participants.find(
        uid => uid !== currentUser.uid
      );

    if(!otherUid)
      continue;

    const userDoc =
      await db.collection("users")
        .doc(otherUid)
        .get();

    if(!userDoc.exists)
      continue;

    const user =
      userDoc.data();

    const div =
      document.createElement("div");

    div.className = "user";

    div.onclick = () =>
      openChat(user);

    div.innerHTML = `

      <div class="avatar">
        ${escapeHtml(
          (user.name || "?")
          .charAt(0)
          .toUpperCase()
        )}
      </div>

      <div class="userInfo">

        <div class="userName">
          ${escapeHtml(user.name || "User")}
        </div>

        <div class="${
          user.online
          ? "online"
          : "offline"
        }">

          ${user.online
            ? "● Online"
            : "● Offline"}

        </div>

      </div>

      ${
        data.unread &&
        data.unread[currentUser.uid] > 0

        ? `<div class="badge">
            ${Math.min(
              data.unread[currentUser.uid],
              100
            )}
          </div>`

        : ""
      }

    `;

    list.appendChild(div);

  }

}


/* =========================
   USERS TAB
========================= */

function showUsers(){

  hideScreens();

  document
    .getElementById("usersScreen")
    .classList.add("active");

  document
    .getElementById("usersBtn")
    .classList.add("active");

  document
    .getElementById("friendsBtn")
    .classList.remove("active");

}


/* =========================
   CHAT
========================= */

async function openChat(user){

  selectedUser = user;

  hideScreens();

  document
    .getElementById("chatScreen")
    .classList.add("active");

  document
    .getElementById("bottomNav")
    .style.display = "none";

  document
    .getElementById("chatUserName")
    .textContent =
      user.name || "User";

  const chatId =
    getChatId(
      currentUser.uid,
      user.uid
    );

  const chatRef =
    db.collection("privateChats")
      .doc(chatId);

  const chatDoc =
    await chatRef.get();

  if(!chatDoc.exists){

    await chatRef.set({

      participants:[
        currentUser.uid,
        user.uid
      ],

      unread:{
        [currentUser.uid]:0,
        [user.uid]:0
      },

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }else{

    await chatRef.update({

      [`unread.${currentUser.uid}`]:0

    });

  }

  listenMessages(chatId);

}


function listenMessages(chatId){

  if(unsubscribeMessages)
    unsubscribeMessages();

  unsubscribeMessages =
    db.collection("privateChats")
      .doc(chatId)
      .collection("messages")
      .orderBy("createdAt")
      .onSnapshot(snapshot => {

        const box =
          document.getElementById("messages");

        box.innerHTML = "";

        snapshot.forEach(doc => {

          const msg = doc.data();

          const div =
            document.createElement("div");

          div.className =
            "message " +
            (
              msg.uid === currentUser.uid
              ? "mine"
              : "theirs"
            );

          div.textContent =
            msg.text || "";

          box.appendChild(div);

        });

        box.scrollTop =
          box.scrollHeight;

      });

}


async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text || !selectedUser)
    return;

  const chatId =
    getChatId(
      currentUser.uid,
      selectedUser.uid
    );

  const chatRef =
    db.collection("privateChats")
      .doc(chatId);

  await chatRef
    .collection("messages")
    .add({

      uid:currentUser.uid,

      text:text,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  await chatRef.update({

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    [`unread.${selectedUser.uid}`]:
      firebase.firestore.FieldValue.increment(1)

  });

  input.value = "";

}


function handleEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}


function closeChat(){

  if(unsubscribeMessages)
    unsubscribeMessages();

  selectedUser = null;

  document
    .getElementById("chatScreen")
    .classList.remove("active");

  document
    .getElementById("bottomNav")
    .style.display = "flex";

  showUsers();

}


function getChatId(a,b){

  return [a,b]
    .sort()
    .join("_");

}


/* =========================
   HELPERS
========================= */

function hideScreens(){

  document
    .querySelectorAll(".screen")
    .forEach(el =>
      el.classList.remove("active")
    );

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LEAVE PAGE
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(currentUser){

      db.collection("users")
        .doc(currentUser.uid)
        .update({

          online:false,

          lastSeen:
            firebase.firestore.FieldValue.serverTimestamp()

        })
        .catch(()=>{});

    }

  }
);

</script>

</body>
</html>
