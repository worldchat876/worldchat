<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="yZ56jFclXP1thT-Q-xCCVeO-i572oXejzlkq7I3O84o" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldChat</title>
  <meta name="monetag" content="6ca3dc7053a741b0d409e6c3a107b8a1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
.header{
  height:64px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px
}
.logo{
  font-size:21px;
  font-weight:700
}
.sub{
  color:#6b7280;
  font-size:14px
}
.wrap{
  max-width:900px;
  margin:25px auto;
  padding:0 15px
}
.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.04)
}
h1,h2{
  margin-top:0
}
label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:12px 0 6px
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px
}
input:focus,select:focus{
  border-color:#6366f1
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.btn{
  border:0;
  background:#4f46e5;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600
}
.btn.full{
  width:100%;
  margin-top:18px
}
.note{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-size:13px;
  color:#64748b
}
.toolbar{
  margin:15px 0
}
.users{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px
}
.user{
  border:1px solid #e5e7eb;
  background:#fff;
  padding:9px 12px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px
}
.user:hover{
  background:#f8fafc
}
.messages,.private-messages{
  height:330px;
  overflow-y:auto;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px
}
.msg{
  background:white;
  border:1px solid #e5e7eb;
  padding:9px 12px;
  border-radius:12px;
  margin-bottom:8px;
  max-width:85%
}
.msg.mine{
  margin-left:auto;
  background:#eef2ff
}
.msg small{
  display:block;
  color:#6b7280;
  font-size:11px;
  margin-bottom:4px
}
.send{
  display:flex;
  gap:8px;
  margin-top:10px
}
.send input{
  flex:1
}
.private{
  display:none
}
.private-head{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:12px;
  margin-bottom:12px
}
.back,.dots{
  border:0;
  background:transparent;
  font-size:25px;
  cursor:pointer
}
.private-user{
  flex:1;
  font-weight:700
}
.private-user small{
  display:block;
  color:#6b7280;
  font-weight:400;
  font-size:12px;
  margin-top:3px
}
.pmsg{
  background:white;
  border:1px solid #e5e7eb;
  padding:9px 12px;
  border-radius:12px;
  margin-bottom:8px;
  max-width:80%
}
.pmsg.mine{
  margin-left:auto;
  background:#eef2ff
}
.menu{
  display:none;
  position:absolute;
  right:0;
  top:42px;
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  overflow:hidden;
  z-index:5
}
.menu button{
  display:block;
  width:150px;
  text-align:left;
  border:0;
  background:white;
  padding:12px;
  cursor:pointer
}
.menu button:hover{
  background:#f3f4f6
}
.status{
  margin-top:10px;
  font-size:13px;
  color:#16a34a
}
.error{
  color:#dc2626
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }
  .send{
    flex-direction:row
  }
  .send .btn{
    padding-left:13px;
    padding-right:13px
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">🌍 WorldChat</div>
  <div id="mini" class="sub"></div>
</header>

<main class="wrap">

<!-- SETUP -->
<section id="setup" class="card">

<h1>Welcome to WorldChat 🌍</h1>

<p class="sub">
Create your profile and enter the global chat.
</p>

<label>Username</label>
<input id="username" maxlength="20" placeholder="Choose a username">

<div class="grid">

<div>
<label>Country</label>
<select id="country"></select>
</div>

<div>
<label>Language</label>
<select id="language"></select>
</div>

<div>
<label>Gender</label>
<select id="gender">
<option value="">Select</option>
<option>Female</option>
<option>Male</option>
<option>Other</option>
<option>Prefer not to say</option>
</select>
</div>

<div>
<label>Age</label>
<select id="age"></select>
</div>

</div>

<div class="note">
This service is for adults 18+ only.
Do not share passwords, private addresses, phone numbers,
or other sensitive personal information.
</div>

<button class="btn full" onclick="enterChat()">
Enter WorldChat
</button>

<div id="status" class="status"></div>

</section>


<!-- CHAT -->
<section id="chat" class="card" style="display:none">

<div id="globalArea">

<h2>Global Chat 💬</h2>

<p id="info" class="sub"></p>

<div class="toolbar">
<input
id="search"
placeholder="Search username, country, language or gender..."
oninput="renderUsers()">
</div>

<div id="users" class="users"></div>

<div id="messages" class="messages"></div>

<div class="send">

<input
id="message"
maxlength="300"
placeholder="Write a message..."
onkeydown="if(event.key==='Enter')sendMessage()">

<button class="btn" onclick="sendMessage()">
Send
</button>

</div>

</div>


<!-- PRIVATE CHAT -->

<div id="privateChat" class="private">

<div class="private-head">

<button class="back" onclick="closePrivateChat()">←</button>

<div id="privateUser" class="private-user"></div>

<button class="dots" onclick="toggleMenu()">⋮</button>

<div id="menu" class="menu">

<button onclick="viewProfile()">
👤 View Profile
</button>

<button onclick="blockUser()">
🚫 Block
</button>

<button onclick="reportUser()">
⚠️ Report
</button>

</div>

</div>

<div id="privateMessages" class="private-messages"></div>

<div class="send">

<input
id="privateMessage"
maxlength="300"
placeholder="Write a private message..."
onkeydown="if(event.key==='Enter')sendPrivateMessage()">

<button class="btn" onclick="sendPrivateMessage()">
Send
</button>

</div>

</div>

</section>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyCxMbGWolalaS_RQgjqyls44Lkn9lsWFYE",
  authDomain: "worldchat-4fc51.firebaseapp.com",
  projectId: "worldchat-4fc51",
  storageBucket: "worldchat-4fc51.firebasestorage.app",
  messagingSenderId: "569064178427",
  appId: "1:569064178427:web:7c65020d3dec55597a265e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let firebaseUid = null;
let me = null;
let privateUser = null;
let privateUnsub = null;
let globalUnsub = null;
let usersUnsub = null;

let blocked = new Set();

let users = [];

const demoUsers = [
  {
    name:"Alex",
    country:"US",
    language:"English",
    gender:"Male"
  },
  {
    name:"Maya",
    country:"IN",
    language:"Hindi",
    gender:"Female"
  },
  {
    name:"Ken",
    country:"JP",
    language:"Japanese",
    gender:"Male"
  },
  {
    name:"Lina",
    country:"DE",
    language:"German",
    gender:"Female"
  }
];


const countries = [

["LK","🇱🇰","Sri Lanka"],
["US","🇺🇸","United States"],
["GB","🇬🇧","United Kingdom"],
["IN","🇮🇳","India"],
["CA","🇨🇦","Canada"],
["AU","🇦🇺","Australia"],
["DE","🇩🇪","Germany"],
["FR","🇫🇷","France"],
["IT","🇮🇹","Italy"],
["ES","🇪🇸","Spain"],
["BR","🇧🇷","Brazil"],
["JP","🇯🇵","Japan"],
["KR","🇰🇷","South Korea"],
["CN","🇨🇳","China"],
["RU","🇷🇺","Russia"],
["AE","🇦🇪","United Arab Emirates"],
["SA","🇸🇦","Saudi Arabia"],
["SG","🇸🇬","Singapore"],
["MY","🇲🇾","Malaysia"],
["TH","🇹🇭","Thailand"],
["PH","🇵🇭","Philippines"],
["ID","🇮🇩","Indonesia"],
["NZ","🇳🇿","New Zealand"],
["NP","🇳🇵","Nepal"],
["BD","🇧🇩","Bangladesh"],
["PK","🇵🇰","Pakistan"],
["TR","🇹🇷","Turkey"],
["NL","🇳🇱","Netherlands"],
["SE","🇸🇪","Sweden"],
["NO","🇳🇴","Norway"]

];


const languages = [

"English",
"Sinhala",
"Tamil",
"Hindi",
"Spanish",
"French",
"German",
"Italian",
"Portuguese",
"Arabic",
"Japanese",
"Korean",
"Chinese",
"Russian",
"Turkish",
"Dutch",
"Malay",
"Thai",
"Bengali",
"Nepali"

];


// COUNTRY OPTIONS

countries.forEach(c=>{

  const o=document.createElement("option");

  o.value=c[0];

  o.textContent=c[1]+" "+c[2];

  document.getElementById("country").appendChild(o);

});


// LANGUAGE OPTIONS

languages.forEach(l=>{

  const o=document.createElement("option");

  o.textContent=l;

  o.value=l;

  document.getElementById("language").appendChild(o);

});


// AGE OPTIONS

for(let i=18;i<=100;i++){

  const o=document.createElement("option");

  o.value=i;

  o.textContent=i;

  document.getElementById("age").appendChild(o);

}


document.getElementById("country").value="LK";
document.getElementById("language").value="English";


// COUNTRY FINDER

function getCountry(code){

  return countries.find(c=>c[0]===code) || countries[0];

}


// FIREBASE AUTH READY

const authReady = auth.signInAnonymously()

.then(result=>{

  firebaseUid=result.user.uid;

  console.log("Firebase UID:",firebaseUid);

})

.catch(error=>{

  console.error(error);

  document.getElementById("status").innerHTML =
  "<span class='error'>Firebase connection failed.</span>";

});


// ENTER CHAT

async function enterChat(){

  const name=document.getElementById("username").value.trim();

  const country=document.getElementById("country").value;

  const language=document.getElementById("language").value;

  const gender=document.getElementById("gender").value;

  const age=document.getElementById("age").value;


  if(!name){

    alert("Please enter a username.");

    return;

  }

  if(!country || !language || !gender || !age){

    alert("Please complete your profile.");

    return;

  }


  me={
    name:name,
    country:country,
    language:language,
    gender:gender,
    age:age,
    uid:null
  };


  const c=getCountry(country);


  document.getElementById("mini").textContent =
  c[1]+" "+name;


  document.getElementById("setup").style.display="none";

  document.getElementById("chat").style.display="block";


  document.getElementById("info").textContent =
  c[1]+" "+c[2]+" • "+language;


  document.getElementById("status").textContent =
  "Connecting to WorldChat...";


  try{

    await authReady;

    if(!firebaseUid){

      throw new Error("Firebase authentication failed");

    }


    me.uid=firebaseUid;


    // SAVE USER

    await db.collection("users")
    .doc(firebaseUid)
    .set({

      uid:firebaseUid,
      name:name,
      country:country,
      language:language,
      gender:gender,

      // Do not publish exact age
      ageBand:getAgeBand(age),

      updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

    },{merge:true});


    document.getElementById("status").textContent =
    "Connected ✓";


    listenUsers();

    listenGlobalMessages();

  }
  catch(error){

    console.error(error);

    document.getElementById("status").innerHTML =
    "<span class='error'>Firebase error. Check Authentication and Firestore Rules.</span>";

  }

}


// AGE BAND

function getAgeBand(age){

  age=Number(age);

  if(age<=24)return "18-24";

  if(age<=34)return "25-34";

  if(age<=44)return "35-44";

  if(age<=54)return "45-54";

  if(age<=64)return "55-64";

  return "65+";

}


// USERS REAL-TIME

function listenUsers(){

  if(usersUnsub) usersUnsub();


  usersUnsub =
  db.collection("users")
  .onSnapshot(snapshot=>{

    const remote=[];


    snapshot.forEach(doc=>{

      const u=doc.data();

      if(u.uid!==firebaseUid){

        remote.push({

          name:u.name || "User",
          country:u.country || "LK",
          language:u.language || "English",
          gender:u.gender || "",
          ageBand:u.ageBand || "",
          uid:u.uid

        });

      }

    });


    users=[
      {
        name:me.name,
        country:me.country,
        language:me.language,
        gender:me.gender,
        uid:firebaseUid
      },
      ...remote
    ];


    renderUsers();

  },error=>{

    console.error("Users error:",error);

  });

}


// RENDER USERS

function renderUsers(){

  const box=document.getElementById("users");

  const search=
  document.getElementById("search").value
  .trim()
  .toLowerCase();


  box.innerHTML="";


  users
  .filter(u=>!blocked.has(u.name))
  .filter(u=>{

    const c=getCountry(u.country);

    const text=
    u.name+" "+
    c[2]+" "+
    u.language+" "+
    u.gender;

    return text.toLowerCase().includes(search);

  })
  .forEach(u=>{

    const c=getCountry(u.country);

    const div=document.createElement("div");

    div.className="user";

    div.textContent=
    c[1]+" "+u.name;

    if(u.uid===firebaseUid){

      div.textContent+=" (You)";

    }
    else{

      div.onclick=()=>openPrivateChat(u);

    }

    box.appendChild(div);

  });

}


// GLOBAL CHAT REAL-TIME

function listenGlobalMessages(){

  if(globalUnsub) globalUnsub();


  globalUnsub =
  db.collection("globalMessages")
  .orderBy("createdAt","asc")
  .limitToLast(100)
  .onSnapshot(snapshot=>{

    const box=document.getElementById("messages");

    box.innerHTML="";


    snapshot.forEach(doc=>{

      const m=doc.data();

      addGlobalMessage(m);

    });


    box.scrollTop=box.scrollHeight;

  },error=>{

    console.error("Global chat:",error);

  });

}


// ADD GLOBAL MESSAGE

function addGlobalMessage(m){

  const box=document.getElementById("messages");

  const div=document.createElement("div");

  div.className="msg";


  if(m.uid===firebaseUid){

    div.classList.add("mine");

  }


  const c=getCountry(m.country || "LK");


  const small=document.createElement("small");

  small.textContent=
  c[1]+" "+(m.name || "User");


  const text=document.createElement("div");

  text.textContent=m.text || "";


  div.appendChild(small);

  div.appendChild(text);

  box.appendChild(div);

}


// SEND GLOBAL MESSAGE

async function sendMessage(){

  const input=document.getElementById("message");

  const text=input.value.trim();


  if(!text)return;


  if(!firebaseUid){

    alert("Please wait for Firebase connection.");

    return;

  }


  try{

    await db.collection("globalMessages").add({

      uid:firebaseUid,

      name:me.name,

      country:me.country,

      text:text,

      createdAt:
      firebase.firestore.FieldValue.serverTimestamp()

    });


    input.value="";

  }
  catch(error){

    console.error(error);

    alert("Message could not be sent.");

  }

}


// PRIVATE CHAT ID

function chatId(a,b){

  return [a,b].sort().join("_");

}


// OPEN PRIVATE CHAT

function openPrivateChat(u){

  if(!u)return;

  if(blocked.has(u.name))return;

  if(!u.uid){

    alert("This user is not connected to Firebase.");

    return;

  }


  privateUser=u;


  document.getElementById("globalArea").style.display="none";

  document.getElementById("privateChat").style.display="block";


  const c=getCountry(u.country);


  document.getElementById("privateUser").innerHTML=
  c[1]+" "+escapeHtml(u.name)+
  "<small>"+escapeHtml(c[2])+
  " • "+escapeHtml(u.language)+
  "</small>";


  document.getElementById("menu").style.display="none";


  listenPrivateMessages(u);

}


// PRIVATE REAL-TIME LISTENER

function listenPrivateMessages(u){

  if(privateUnsub)privateUnsub();


  const id=chatId(firebaseUid,u.uid);


  const chatRef=
  db.collection("privateChats").doc(id);


  // CREATE / UPDATE CHAT PARTICIPANTS

  chatRef.set({

    participants:[firebaseUid,u.uid],

    updatedAt:
    firebase.firestore.FieldValue.serverTimestamp()

  },{merge:true});


  privateUnsub=
  chatRef
  .collection("messages")
  .orderBy("createdAt","asc")
  .limitToLast(100)
  .onSnapshot(snapshot=>{

    const box=document.getElementById("privateMessages");

    box.innerHTML="";


    snapshot.forEach(doc=>{

      const m=doc.data();

      const div=document.createElement("div");

      div.className="pmsg";


      if(m.uid===firebaseUid){

        div.classList.add("mine");

      }


      div.textContent=m.text || "";

      box.appendChild(div);

    });


    box.scrollTop=box.scrollHeight;

  },error=>{

    console.error("Private chat:",error);

  });

}


// SEND PRIVATE MESSAGE

async function sendPrivateMessage(){

  const input=document.getElementById("privateMessage");

  const text=input.value.trim();


  if(!text || !privateUser)return;


  if(!firebaseUid){

    alert("Firebase is not connected.");

    return;

  }


  try{

    const id=chatId(firebaseUid,privateUser.uid);


    const chatRef=
    db.collection("privateChats").doc(id);


    await chatRef.set({

      participants:[firebaseUid,privateUser.uid],

      updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

    },{merge:true});


    await chatRef
    .collection("messages")
    .add({

      uid:firebaseUid,

      text:text,

      createdAt:
      firebase.firestore.FieldValue.serverTimestamp()

    });


    input.value="";

  }
  catch(error){

    console.error(error);

    alert("Private message could not be sent. Check Firestore Rules.");

  }

}


// CLOSE PRIVATE CHAT

function closePrivateChat(){

  if(privateUnsub){

    privateUnsub();

    privateUnsub=null;

  }


  privateUser=null;


  document.getElementById("privateChat").style.display="none";

  document.getElementById("globalArea").style.display="block";

  document.getElementById("menu").style.display="none";

}


// MENU

function toggleMenu(){

  const menu=document.getElementById("menu");

  menu.style.display=
  menu.style.display==="block"
  ? "none"
  : "block";

}


// VIEW PROFILE

function viewProfile(){

  if(!privateUser)return;


  const c=getCountry(privateUser.country);


  alert(
    "Username: "+privateUser.name+
    "\nCountry: "+c[1]+" "+c[2]+
    "\nLanguage: "+privateUser.language+
    "\nGender: "+privateUser.gender
  );


  document.getElementById("menu").style.display="none";

}


// BLOCK

function blockUser(){

  if(!privateUser)return;


  blocked.add(privateUser.name);


  alert(
    privateUser.name+
    " has been blocked."
  );


  closePrivateChat();

  renderUsers();

}


// REPORT

async function reportUser(){

  if(!privateUser)return;


  try{

    await db.collection("reports").add({

      reporterUid:firebaseUid,

      reportedUid:privateUser.uid,

      reportedName:privateUser.name,

      createdAt:
      firebase.firestore.FieldValue.serverTimestamp()

    });


    alert("Report submitted.");

  }
  catch(error){

    console.error(error);

    alert("Report could not be submitted.");

  }


  document.getElementById("menu").style.display="none";

}


// HTML ESCAPE

function escapeHtml(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

</script>

</body>
</html>
